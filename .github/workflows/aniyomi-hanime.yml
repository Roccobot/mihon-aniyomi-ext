name: Aniyomi - hanime.tv

# Un workflow per ecosistema, perché i build sono separati: questo tocca solo aniyomi/.
on:
  push:
    branches: [main]
    paths: ['aniyomi/**', '.github/workflows/aniyomi-hanime.yml']
    tags: ['v*']
  pull_request:
    paths: ['aniyomi/**', '.github/workflows/aniyomi-hanime.yml']
  workflow_dispatch:

# ⚠️ I due workflow scrivono nella STESSA release: senza questa coda possono leggere il corpo
# delle note nello stesso istante, e l'ultimo a scrivere cancellerebbe la riga dell'altro.
# `cancel-in-progress: false` perché qui il secondo deve aspettare, non essere buttato via.
concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  build:
    name: Compila l'estensione
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: aniyomi

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ NO `build-root-directory` here: that input does not exist in this action and was
      # silently ignored, which the run reported as 'Unexpected input(s)'. The working
      # directory is already set by `defaults.run` above, which is what actually matters.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      # ⚠️⚠️ LA FIRMA DEVE ESSERE STABILE, e non è un dettaglio di stile: Android rifiuta un
      # aggiornamento firmato con una chiave diversa da quella dell'app installata, con
      # 'conflitto con un pacchetto esistente'. Un build di debug usa `~/.android/debug.keystore`,
      # che su un runner pulito **non esiste e viene generato ogni volta**: ogni versione portava
      # quindi una firma nuova, e l'aggiornamento proposto dall'app non si poteva installare.
      # La chiave vive nei secret del repository e non è mai committata.
      - name: Prepara la chiave di firma
        id: chiave
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -eu
          if [ -n "${SIGNING_KEY:-}" ]; then
            # `rootProject` qui è `aniyomi/`, che è già la cartella di lavoro: il telaio cerca
            # il keystore in `rootProject.file("signingkey.jks")`.
            printf '%s' "$SIGNING_KEY" | base64 -d > signingkey.jks
            echo "firmata=si" >> "$GITHUB_OUTPUT"
          else
            # ⚠️ Non fallisce: senza i secret si compila come prima. Una configurazione
            # incompleta non deve bloccare le build, e il nome del file prodotto dice da sé
            # quale delle due strade è stata presa.
            echo "firmata=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -eu
          if [ "${{ steps.chiave.outputs.firmata }}" = "si" ]; then
            ./gradlew :src:en:hanime:assembleRelease --stacktrace
          else
            ./gradlew :src:en:hanime:assembleDebug --stacktrace
          fi

      # La chiave non deve sopravvivere al passo che la usa, nemmeno su un runner effimero.
      - name: Rimuovi la chiave
        if: always()
        run: rm -f signingkey.jks

      # ⚠️ NIENTE actions/upload-artifact, e non è una semplificazione: quella azione gira
      # ancora su Node 20 anche alla v5, ed è la sola origine dell'avviso di deprecazione che
      # restava. Togliendola l'avviso cade all'origine, e l'APK finisce in un posto migliore:
      # una Release 'latest' aggiornata a ogni build, che si scarica con un tocco dal telefono,
      # non chiede l'accesso, non arriva in uno zip e non scade dopo 90 giorni.
      - name: Pubblica l'APK nella Release 'latest'
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # ⚠️ Il glob prende `debug` e `release` senza nominarli: quale dei due esista dipende dai
          # secret di firma, e un percorso fisso avrebbe rotto la pubblicazione il giorno in cui
          # sono stati aggiunti.
          BUILT=$(ls src/en/hanime/build/outputs/apk/*/*.apk | head -1)
          # ⚠️ NOME FISSO, e non è un vezzo: `--clobber` sostituisce solo a parità di nome, e il
          # nome prodotto dal build contiene la versione, quindi ogni build ne aggiungeva uno
          # nuovo (la release si è ritrovata con la v14.16 e la v14.17 insieme). Con un nome
          # stabile l'allegato si sostituisce davvero, e l'indirizzo di download non cambia mai.
          cp "$BUILT" aniyomi-hanime.apk
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --prerelease --title "Ultima build" \
                 --notes "APK delle estensioni di questo repository."
          gh release upload latest aniyomi-hanime.apk --clobber
          # ⚠️ Le note si riscrivono CONSERVANDO la riga dell'altra estensione: i due workflow
          # scrivono nella stessa release, e un `--notes` secco cancellerebbe quello che ha
          # appena scritto l'altro. Ogni riga porta il nome della sua estensione come marcatore.
          # ⚠️ L'ora è quella ITALIANA, non UTC: la pagina della release la legge una persona,
          # e due ore di scarto fra quello che vede e quello che le viene detto bastano a far
          # credere di aver scaricato il file sbagliato.
          MARK="Aniyomi hanime"
          QUANDO=$(TZ=Europe/Rome date '+%d/%m/%Y %H:%M %Z')
          RIGA="- **$MARK**: \`aniyomi-hanime.apk\`, da $(basename "$BUILT"), pubblicato il $QUANDO (commit \`$(echo "$GITHUB_SHA" | cut -c1-7)\`)."
          # ⚠️ Si tengono le SOLE righe marcate (`- **`), non tutto il corpo tranne la propria:
          # il testo scritto alla creazione della release non porta alcun marcatore, quindi con
          # un filtro per sola esclusione sopravviveva a ogni riscrittura e avrebbe continuato a
          # dichiarare una versione vecchia accanto a quella nuova. L'ordinamento tiene le due
          # estensioni sempre nella stessa posizione, invece di alternarle a ogni pubblicazione.
          VECCHIE=$(gh release view latest --json body -q .body \
            | grep '^- \*\*' | grep -v "\*\*$MARK\*\*" || true)
          NOTE=$(printf '%s\n%s\n' "$VECCHIE" "$RIGA" | grep . | sort)
          printf 'APK delle estensioni di questo repository.\n\n%s\n' "$NOTE" \
            | gh release edit latest --notes-file -
          # Ripulisce gli allegati versionati rimasti dai giri precedenti.
          # ⚠️⚠️ Il filtro nomina il PROPRIO prefisso e non esclude soltanto il proprio nome
          # stabile: la release ospita anche l'APK dell'altra estensione, e un `grep -v` sul solo
          # `aniyomi-hanime.apk` lo cancellava. Non se n'era accorto nessuno perché il primo giro
          # ha visto i due workflow in coda, con l'altro che ricaricava il suo allegato subito
          # dopo: al primo push che tocca `aniyomi/` da solo, l'APK di Mihon sarebbe sparito.
          gh release view latest --json assets -q '.assets[].name' \
            | grep '^aniyomi-en\.hanime-' \
            | while read -r old; do gh release delete-asset latest "$old" -y; done

      # ⚠️⚠️ IL REPOSITORY DI ESTENSIONI, che è il solo canale da cui le app sanno di essere
      # vecchie: senza, un APK installato a mano non ha nessuno che possa dirgli che esiste una
      # versione nuova. Vive nel branch `gh-pages` di QUESTO repository, non altrove, e la
      # ragione è che una seconda sede vorrebbe un token verso un altro repository e potrebbe
      # restare indietro in silenzio. Qui build, APK e indice si muovono insieme o non si
      # muovono affatto.
      # ⚠️ Branch a parte e non `main`: il codice non deve vedersi arrivare commit automatici a
      # ogni build, e la storia del progetto resta leggibile.
      - name: Pubblica nel repository di estensioni
        if: github.event_name != 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          BUILT=$(ls aniyomi/src/en/hanime/build/outputs/apk/*/*.apk | head -1)
          REMOTO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Se il branch non esiste ancora lo si crea ORFANO: il repository di pubblicazione
          # non ha niente da spartire con la storia del codice.
          rm -rf pagine
          git clone --branch gh-pages --depth 1 "$REMOTO" pagine 2>/dev/null || {
            git clone --depth 1 "$REMOTO" pagine
            git -C pagine checkout --orphan gh-pages
            git -C pagine rm -rq --cached . || true
            find pagine -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          }
          # ⚠️ Si ripulisce SOLO la propria cartella: l'altra estensione pubblica nella sua, e
          # un `rm` più largo la cancellerebbe a ogni build, come già successo con gli allegati
          # della release.
          mkdir -p pagine/aniyomi/apk
          rm -f pagine/aniyomi/apk/*.apk
          cp "$BUILT" pagine/aniyomi/apk/
          # ⚠️ L'indice si GENERA dal codice: nome, lingua, versione e identificativo della
          # sorgente vengono letti dai sorgenti e dal telaio, mai scritti a mano in due posti.
          python3 scripts/genindex.py aniyomi aniyomi hanime "$BUILT" pagine/aniyomi
          git -C pagine add -A
          git -C pagine -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "hanime $(basename "$BUILT")" || { echo "niente da pubblicare"; exit 0; }
          git -C pagine push origin gh-pages

      # Su tag: una Release che resta, per le versioni che vale la pena tenere.
      - name: Pubblica la Release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "APK dell'estensione hanime.tv per Aniyomi, build ${GITHUB_SHA}." \
            src/en/hanime/build/outputs/apk/*/*.apk
