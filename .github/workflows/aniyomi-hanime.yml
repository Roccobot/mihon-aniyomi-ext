name: Aniyomi - hanime.tv

# Un workflow per ecosistema, perché i build sono separati: questo tocca solo aniyomi/.
on:
  push:
    branches: [main]
    paths: ['aniyomi/**', '.github/workflows/aniyomi-hanime.yml']
    tags: ['v*']
  pull_request:
    paths: ['aniyomi/**', '.github/workflows/aniyomi-hanime.yml']
  workflow_dispatch:

# ⚠️ I due workflow scrivono nella STESSA release: senza questa coda possono leggere il corpo
# delle note nello stesso istante, e l'ultimo a scrivere cancellerebbe la riga dell'altro.
# `cancel-in-progress: false` perché qui il secondo deve aspettare, non essere buttato via.
concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  build:
    name: Compila l'estensione
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: aniyomi

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ NO `build-root-directory` here: that input does not exist in this action and was
      # silently ignored, which the run reported as 'Unexpected input(s)'. The working
      # directory is already set by `defaults.run` above, which is what actually matters.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      # Build di debug per scelta: una release vuole un keystore, e questa estensione si
      # installa a mano su un telefono. L'unica differenza pratica è che Aniyomi chiede
      # una volta di fidarsi della firma.
      - name: Build
        run: ./gradlew :src:en:hanime:assembleDebug --stacktrace

      # ⚠️ NIENTE actions/upload-artifact, e non è una semplificazione: quella azione gira
      # ancora su Node 20 anche alla v5, ed è la sola origine dell'avviso di deprecazione che
      # restava. Togliendola l'avviso cade all'origine, e l'APK finisce in un posto migliore:
      # una Release 'latest' aggiornata a ogni build, che si scarica con un tocco dal telefono,
      # non chiede l'accesso, non arriva in uno zip e non scade dopo 90 giorni.
      - name: Pubblica l'APK nella Release 'latest'
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          BUILT=$(ls src/en/hanime/build/outputs/apk/debug/*.apk | head -1)
          # ⚠️ NOME FISSO, e non è un vezzo: `--clobber` sostituisce solo a parità di nome, e il
          # nome prodotto dal build contiene la versione, quindi ogni build ne aggiungeva uno
          # nuovo (la release si è ritrovata con la v14.16 e la v14.17 insieme). Con un nome
          # stabile l'allegato si sostituisce davvero, e l'indirizzo di download non cambia mai.
          cp "$BUILT" aniyomi-hanime.apk
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --prerelease --title "Ultima build" \
                 --notes "APK delle estensioni di questo repository."
          gh release upload latest aniyomi-hanime.apk --clobber
          # ⚠️ Le note si riscrivono CONSERVANDO la riga dell'altra estensione: i due workflow
          # scrivono nella stessa release, e un `--notes` secco cancellerebbe quello che ha
          # appena scritto l'altro. Ogni riga porta il nome della sua estensione come marcatore.
          # ⚠️ L'ora è quella ITALIANA, non UTC: la pagina della release la legge una persona,
          # e due ore di scarto fra quello che vede e quello che le viene detto bastano a far
          # credere di aver scaricato il file sbagliato.
          MARK="Aniyomi hanime"
          QUANDO=$(TZ=Europe/Rome date '+%d/%m/%Y %H:%M %Z')
          RIGA="- **$MARK**: \`aniyomi-hanime.apk\`, da $(basename "$BUILT"), pubblicato il $QUANDO (commit \`$(echo "$GITHUB_SHA" | cut -c1-7)\`)."
          # ⚠️ Si tengono le SOLE righe marcate (`- **`), non tutto il corpo tranne la propria:
          # il testo scritto alla creazione della release non porta alcun marcatore, quindi con
          # un filtro per sola esclusione sopravviveva a ogni riscrittura e avrebbe continuato a
          # dichiarare una versione vecchia accanto a quella nuova. L'ordinamento tiene le due
          # estensioni sempre nella stessa posizione, invece di alternarle a ogni pubblicazione.
          VECCHIE=$(gh release view latest --json body -q .body \
            | grep '^- \*\*' | grep -v "\*\*$MARK\*\*" || true)
          NOTE=$(printf '%s\n%s\n' "$VECCHIE" "$RIGA" | grep . | sort)
          printf 'APK delle estensioni di questo repository.\n\n%s\n' "$NOTE" \
            | gh release edit latest --notes-file -
          # Ripulisce gli allegati versionati rimasti dai giri precedenti.
          # ⚠️⚠️ Il filtro nomina il PROPRIO prefisso e non esclude soltanto il proprio nome
          # stabile: la release ospita anche l'APK dell'altra estensione, e un `grep -v` sul solo
          # `aniyomi-hanime.apk` lo cancellava. Non se n'era accorto nessuno perché il primo giro
          # ha visto i due workflow in coda, con l'altro che ricaricava il suo allegato subito
          # dopo: al primo push che tocca `aniyomi/` da solo, l'APK di Mihon sarebbe sparito.
          gh release view latest --json assets -q '.assets[].name' \
            | grep '^aniyomi-en\.hanime-' \
            | while read -r old; do gh release delete-asset latest "$old" -y; done

      # Su tag: una Release che resta, per le versioni che vale la pena tenere.
      - name: Pubblica la Release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "APK dell'estensione hanime.tv per Aniyomi, build ${GITHUB_SHA}." \
            src/en/hanime/build/outputs/apk/debug/*.apk
