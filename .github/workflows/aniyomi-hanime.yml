name: Aniyomi - hanime.tv

# Un workflow per ecosistema, perche i build sono separati: questo tocca solo aniyomi/.
on:
  push:
    branches: [main]
    paths: ['aniyomi/**', '.github/workflows/aniyomi-hanime.yml']
    tags: ['v*']
  pull_request:
    paths: ['aniyomi/**', '.github/workflows/aniyomi-hanime.yml']
  workflow_dispatch:

jobs:
  build:
    name: Compila l'estensione
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: aniyomi

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ NO `build-root-directory` here: that input does not exist in this action and was
      # silently ignored, which the run reported as 'Unexpected input(s)'. The working
      # directory is already set by `defaults.run` above, which is what actually matters.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      # Build di debug per scelta: una release vuole un keystore, e questa estensione si
      # installa a mano su un telefono. L'unica differenza pratica e che Aniyomi chiede
      # una volta di fidarsi della firma.
      - name: Build
        run: ./gradlew :src:en:hanime:assembleDebug --stacktrace

      - name: Raccogli l'APK
        uses: actions/upload-artifact@v5
        with:
          name: aniyomi-hanime-apk
          path: aniyomi/src/en/hanime/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Solo su tag: l'artefatto sopra basta per le build di tutti i giorni, la Release e
      # per le versioni che vale la pena tenere, e da telefono si apre in un clic.
      - name: Pubblica la Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "APK dell'estensione hanime.tv per Aniyomi, build ${GITHUB_SHA}." \
            src/en/hanime/build/outputs/apk/debug/*.apk
