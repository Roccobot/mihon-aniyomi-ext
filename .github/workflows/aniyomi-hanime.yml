name: Aniyomi - hanime.tv

# Un workflow per ecosistema, perche i build sono separati: questo tocca solo aniyomi/.
on:
  push:
    branches: [main]
    paths: ['aniyomi/**', '.github/workflows/aniyomi-hanime.yml']
    tags: ['v*']
  pull_request:
    paths: ['aniyomi/**', '.github/workflows/aniyomi-hanime.yml']
  workflow_dispatch:

jobs:
  build:
    name: Compila l'estensione
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: aniyomi

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ NO `build-root-directory` here: that input does not exist in this action and was
      # silently ignored, which the run reported as 'Unexpected input(s)'. The working
      # directory is already set by `defaults.run` above, which is what actually matters.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      # Build di debug per scelta: una release vuole un keystore, e questa estensione si
      # installa a mano su un telefono. L'unica differenza pratica e che Aniyomi chiede
      # una volta di fidarsi della firma.
      - name: Build
        run: ./gradlew :src:en:hanime:assembleDebug --stacktrace

      # ⚠️ NIENTE actions/upload-artifact, e non e una semplificazione: quella azione gira
      # ancora su Node 20 anche alla v5, ed e la sola origine dell'avviso di deprecazione che
      # restava. Togliendola l'avviso cade all'origine, e l'APK finisce in un posto migliore:
      # una Release 'latest' aggiornata a ogni build, che si scarica con un tocco dal telefono,
      # non chiede l'accesso, non arriva in uno zip e non scade dopo 90 giorni.
      - name: Pubblica l'APK nella Release 'latest'
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          APK=$(ls src/en/hanime/build/outputs/apk/debug/*.apk | head -1)
          NOTE="APK dell'estensione hanime.tv per Aniyomi. Build ${GITHUB_SHA}."
          # La release esiste una volta sola e poi si aggiorna: --clobber sostituisce l'asset
          # invece di accumularne uno per build.
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --prerelease --title "Ultima build" --notes "$NOTE"
          gh release edit latest --notes "$NOTE"
          gh release upload latest "$APK" --clobber

      # Su tag: una Release che resta, per le versioni che vale la pena tenere.
      - name: Pubblica la Release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "APK dell'estensione hanime.tv per Aniyomi, build ${GITHUB_SHA}." \
            src/en/hanime/build/outputs/apk/debug/*.apk
