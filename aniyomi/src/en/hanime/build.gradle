ext {
    // Label of the installed app ("Aniyomi: Hanime Roccobot"). The name shown in the
    // app's source list is `name` in Hanime.kt: two separate places, to keep in step.
    extName = 'Hanime Roccobot'
    extClass = '.Hanime'
    // Bump on every build meant to replace an installed one: Android refuses an APK
    // whose versionCode is not higher than the one already on the device.
    extVersionCode = 26
    isNsfw = true
}

apply from: "$rootDir/common.gradle"
