# Memory: the Android build tooling needs a generous heap, and the CI runner has it.
org.gradle.jvmargs=-Xmx5120m
org.gradle.parallel=true
org.gradle.workers.max=5
org.gradle.caching=true

# Required, not optional: one of the transitive dependencies of the extension API is an
# AndroidX artifact, and without this flag resource processing fails outright.
android.useAndroidX=true

# The extension API expects the old resource-id behaviour, so both stay off.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
